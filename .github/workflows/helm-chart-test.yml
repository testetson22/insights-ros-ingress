name: Helm Chart Quality Test

# This workflow tests the insights-ros-ingress Helm chart deployment on KIND with locally built application
#
# Workflow Steps:
# 1. make deploy-kind    - Deploy KIND cluster using authoritative script from ros-helm-chart
# 2. make helm-install   - Install Helm chart using authoritative script from ros-helm-chart
# 3. make update-kind-image - Build local code and update deployment to use it instead of registry image
# 4. Run dataflow tests  - Execute test-k8s-dataflow.sh to verify full functionality
#
# This ensures CI/CD uses the same workflow as local development
#
# Features:
# - Uses Podman as container runtime (daemonless, rootless)
# - Uses archive method for reliable Podman to KIND image transfer
# - Tests actual code changes in PR/push (not registry images)
# - Uses pullPolicy: Never for locally built images
# - Downloads authoritative deployment scripts from ros-helm-chart on every run

on:
  pull_request:
    paths:
      - 'deployments/kubernetes/scripts/**'
      - '.github/workflows/helm-chart-test*.yml'
      # Also run when application code changes since we now test the built code
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'main.go'
      - 'Dockerfile'
      - 'Makefile'
  push:
    branches: [ main ]
    paths:
      - 'deployments/kubernetes/scripts/**'
      - '.github/workflows/helm-chart-test*.yml'
      # Also run when application code changes since we now test the built code
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'main.go'
      - 'Dockerfile'
      - 'Makefile'
  workflow_dispatch:

jobs:
  helm-chart-test:
    name: Test Helm Chart Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTAINER_RUNTIME: podman
      REGISTRY: quay.io/insights-onprem
      IMAGE_NAME: insights-ros-ingress

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          # Install Podman
          sudo apt-get update
          sudo apt-get install -y podman

          # Verify Podman installation
          echo "Podman version:"
          podman --version
          echo "Podman info:"
          podman info
          echo "Testing Podman connectivity:"
          podman run --rm quay.io/podman/hello

      - name: Install KIND
        run: |
          # Get the latest KIND version
          KIND_VERSION=$(curl -s https://api.github.com/repos/kubernetes-sigs/kind/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Latest KIND version: $KIND_VERSION"

          # Download and install the latest KIND version
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

          # Verify installation
          kind version

          # Configure Kind to use Podman explicitly
          echo "Podman driver will be used by Kind"

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Set up environment and Podman configuration
        run: |
          echo "KIND_CLUSTER_NAME=insights-ros-ingress-test-cluster" >> $GITHUB_ENV
          echo "HELM_RELEASE_NAME=ros-ingress-test" >> $GITHUB_ENV
          echo "NAMESPACE=insights-ros-ingress-test" >> $GITHUB_ENV
          echo "IMAGE_TAG=ci-test-${{ github.run_number }}" >> $GITHUB_ENV

          # Configure KIND to use Podman as container runtime
          export KIND_EXPERIMENTAL_PROVIDER=podman
          echo "KIND_EXPERIMENTAL_PROVIDER=podman" >> $GITHUB_ENV
          echo "🔧 Configured KIND to use Podman runtime"

      - name: Deploy KIND Cluster (using make target)
        timeout-minutes: 15
        run: |
          export KIND_CLUSTER_NAME=${{ env.KIND_CLUSTER_NAME }}
          export HELM_RELEASE_NAME=${{ env.HELM_RELEASE_NAME }}
          export NAMESPACE=${{ env.NAMESPACE }}
          export KIND_EXPERIMENTAL_PROVIDER=${{ env.KIND_EXPERIMENTAL_PROVIDER }}

          echo "🚀 Deploying KIND cluster using make deploy-kind..."
          make deploy-kind

          # Verify cluster is running
          echo "✅ Verifying cluster status..."
          kind get clusters
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Install Helm Chart (using make target)
        timeout-minutes: 15
        run: |
          export KIND_CLUSTER_NAME=${{ env.KIND_CLUSTER_NAME }}
          export HELM_RELEASE_NAME=${{ env.HELM_RELEASE_NAME }}
          export NAMESPACE=${{ env.NAMESPACE }}

          echo "📦 Installing Helm chart using make helm-install..."
          make helm-install

          # Verify deployment
          echo "✅ Verifying Helm chart deployment..."
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get services -n ${{ env.NAMESPACE }}
          kubectl get ingress -n ${{ env.NAMESPACE }}

      - name: Build and Deploy Local Code (using make target)
        timeout-minutes: 15
        run: |
          export KIND_CLUSTER_NAME=${{ env.KIND_CLUSTER_NAME }}
          export NAMESPACE=${{ env.NAMESPACE }}
          export IMAGE_TAG=${{ env.IMAGE_TAG }}
          export CONTAINER_RUNTIME=${{ env.CONTAINER_RUNTIME }}
          export KIND_EXPERIMENTAL_PROVIDER=${{ env.KIND_EXPERIMENTAL_PROVIDER }}

          echo "🔨 Building and deploying local code using make update-kind-image..."
          make update-kind-image

          # Verify pods are using the local image
          echo "✅ Verifying pods are using local image..."
          kubectl get pods -n ${{ env.NAMESPACE }} -o jsonpath='{range .items[*]}{.metadata.name}{": "}{.spec.containers[*].image}{" (pullPolicy: "}{.spec.containers[*].imagePullPolicy}{")"}{"\n"}{end}' | grep insights-ros-ingress || true

      - name: Wait for services to stabilize
        run: |
          echo "⏳ Waiting for all pods to be ready..."

          # Wait for all pods to be in Running state
          timeout 600 bash -c "until kubectl wait --for=condition=ready pod -l 'app.kubernetes.io/instance=${{ env.HELM_RELEASE_NAME }}' -n ${{ env.NAMESPACE }} --timeout=30s 2>/dev/null; do echo 'Waiting for pods...'; sleep 10; done"

          # Additional wait for services to fully initialize
          echo "✅ All pods ready, waiting additional 30 seconds for service initialization..."
          sleep 30

          # Show final pod status
          echo "📊 Final pod status:"
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide

      - name: Verify cluster and services health
        run: |
          echo "=== Cluster Health Check ==="
          kubectl get nodes -o wide
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide
          kubectl get services -n ${{ env.NAMESPACE }}

          echo "=== Container Status ==="
          ${{ env.CONTAINER_RUNTIME }} ps --filter "label=io.x-k8s.kind.cluster=${{ env.KIND_CLUSTER_NAME }}"

          echo "=== Resource Usage ==="
          df -h
          free -h

      - name: Run Dataflow Test
        timeout-minutes: 15
        run: |
          cd deployments/kubernetes/scripts
          export KIND_CLUSTER_NAME=${{ env.KIND_CLUSTER_NAME }}
          export HELM_RELEASE_NAME=${{ env.HELM_RELEASE_NAME }}
          export NAMESPACE=${{ env.NAMESPACE }}

          # Make scripts executable
          chmod +x test-k8s-dataflow.sh

          # Run dataflow test
          echo "Running dataflow test..."
          ./test-k8s-dataflow.sh

      - name: Show cluster status on failure
        if: failure()
        run: |
          # Configure KIND to use Podman as container runtime
          export KIND_EXPERIMENTAL_PROVIDER=podman

          echo "=== Container Runtime Status ==="
          ${{ env.CONTAINER_RUNTIME }} --version || true
          ${{ env.CONTAINER_RUNTIME }} info || true
          ${{ env.CONTAINER_RUNTIME }} ps -a || true
          ${{ env.CONTAINER_RUNTIME }} images | head -10 || true

          echo "=== Kind Status ==="
          kind version || true
          kind get clusters || true

          echo "=== Cluster Status ==="
          kubectl cluster-info || true
          kubectl version || true

          echo "=== Pods Status ==="
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide || true
          kubectl get pods --all-namespaces | head -20 || true

          echo "=== Services Status ==="
          kubectl get services -n ${{ env.NAMESPACE }} || true

          echo "=== Events ==="
          kubectl get events -n ${{ env.NAMESPACE }} --sort-by='.lastTimestamp' || true
          kubectl get events --all-namespaces --sort-by='.lastTimestamp' | head -20 || true

          echo "=== Persistent Volumes ==="
          kubectl get pv,pvc -n ${{ env.NAMESPACE }} || true

          echo "=== Node Status ==="
          kubectl get nodes -o wide || true
          kubectl describe nodes || true

          echo "=== Authentication Status ==="
          echo "Service Accounts:"
          kubectl get serviceaccounts -n ${{ env.NAMESPACE }} || true
          echo "Secrets:"
          kubectl get secrets -n ${{ env.NAMESPACE }} | grep -E "(insights-ros-ingress|token)" || true
          echo "Authentication files:"
          ls -la /tmp/ | grep -E "(kubeconfig|auth)" || true

          echo "=== Ingress Service Logs ==="
          kubectl logs -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=ingress --tail=30 || true
          echo "=== Recent Logs ==="
          for pod in $(kubectl get pods -n ${{ env.NAMESPACE }} -o name | head -5); do
            echo "--- Logs for $pod ---"
            kubectl logs -n ${{ env.NAMESPACE }} $pod --tail=20 || true
            kubectl logs -n ${{ env.NAMESPACE }} $pod --previous --tail=10 || true
          done

          echo "=== Container Logs ==="
          for container in $(${{ env.CONTAINER_RUNTIME }} ps --filter "label=io.x-k8s.kind.cluster=${{ env.KIND_CLUSTER_NAME }}" --format "{{.Names}}" | head -3); do
            echo "--- ${{ env.CONTAINER_RUNTIME }} logs for $container ---"
            ${{ env.CONTAINER_RUNTIME }} logs $container --tail=20 || true
          done

          echo "=== System Resources ==="
          df -h || true
          free -h || true
          top -bn1 | head -20 || true

      - name: Cleanup
        if: always()
        run: |
          # Configure KIND to use Podman as container runtime
          export KIND_EXPERIMENTAL_PROVIDER=podman
          kind delete cluster --name ${{ env.KIND_CLUSTER_NAME }} || true